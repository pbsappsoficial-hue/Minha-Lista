<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lista de Compras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* Modo Claro (padrão) */
        :root {
            --bg-body: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            --bg-container: rgba(255, 255, 255, 0.96);
            --bg-painel: white;
            --text-color: #1e293b;
            --text-secondary: #334155;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
            --input-focus: #6366f1;
            --btn-primary: linear-gradient(95deg, #4f46e5, #7c3aed);
            --btn-primary-hover: rgba(79, 70, 229, 0.35);
            --usuario-info-bg: #f1f5f9;
            --btn-menu-bg: #f1f5f9;
            --btn-menu-hover: #e2e8f0;
            --modal-bg: white;
            --modal-btn-bg: #f8fafc;
            --modal-btn-border: #e2e8f0;
            --modal-btn-hover: #eef2ff;
            --form-bg: #f8fafd;
            --form-border: #e2edff;
            --header-bg: #eef2ff;
            --item-bg: white;
            --item-border: #edf2f7;
            --item-shadow: rgba(0, 0, 0, 0.05);
            --total-bg: #f1f5f9;
            --total-color: #0f172a;
            --separador-bg: #eef2ff;
            --separador-color: #4f46e5;
            --badge-admin: #dc2626;
            --btn-add: #10b981;
            --btn-add-hover: #059669;
            --btn-acao: #f1f5f9;
            --btn-acao-hover: #e2e8f0;
            --btn-del: #fee2e2;
            --btn-del-hover: #fecaca;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #cbd5e1;
            --comprado-bg: #f8fafc;
        }

        /* Modo Escuro Bem Preto */
        body.dark {
            --bg-body: #000000;
            --bg-container: #0a0a0a;
            --bg-painel: #0a0a0a;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #1a1a1a;
            --input-bg: #1a1a1a;
            --input-border: #2a2a2a;
            --input-focus: #818cf8;
            --btn-primary: linear-gradient(95deg, #6366f1, #a78bfa);
            --btn-primary-hover: rgba(99, 102, 241, 0.4);
            --usuario-info-bg: #1a1a1a;
            --btn-menu-bg: #1a1a1a;
            --btn-menu-hover: #2a2a2a;
            --modal-bg: #0a0a0a;
            --modal-btn-bg: #1a1a1a;
            --modal-btn-border: #2a2a2a;
            --modal-btn-hover: #2a2a2a;
            --form-bg: #0a0a0a;
            --form-border: #1a1a1a;
            --header-bg: #1a1a1a;
            --item-bg: #0a0a0a;
            --item-border: #1a1a1a;
            --item-shadow: rgba(0, 0, 0, 0.5);
            --total-bg: #1a1a1a;
            --total-color: #ffffff;
            --separador-bg: #1a1a1a;
            --separador-color: #a78bfa;
            --badge-admin: #ef4444;
            --btn-add: #059669;
            --btn-add-hover: #10b981;
            --btn-acao: #1a1a1a;
            --btn-acao-hover: #2a2a2a;
            --btn-del: #3a0a0a;
            --btn-del-hover: #5a1010;
            --scrollbar-track: #1a1a1a;
            --scrollbar-thumb: #2a2a2a;
            --comprado-bg: #0a0a0a;
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            background: var(--bg-container);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .painel {
            padding: 2rem;
        }

        #login {
            background: var(--bg-painel);
            text-align: center;
            transition: background 0.3s ease;
        }

        #login h2 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .campo {
            width: 100%;
            max-width: 320px;
            margin: 0.75rem auto;
        }

        .campo input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--input-border);
            border-radius: 60px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--input-bg);
            color: var(--text-color);
        }

        .campo input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--input-bg);
        }

        .campo input::placeholder {
            color: var(--text-secondary);
        }

        .btn-principal {
            background: var(--btn-primary);
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.3);
            margin-top: 10px;
        }

        .btn-principal:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px var(--btn-primary-hover);
        }

        .topo-app {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .titulo-app {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color), var(--input-focus));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .usuario-info {
            background: var(--usuario-info-bg);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
        }

        .btn-menu {
            background: var(--btn-menu-bg);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 30px;
            font-size: 1.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .btn-menu:hover {
            background: var(--btn-menu-hover);
            transform: scale(0.96);
        }

        .modal-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-menu-conteudo {
            background: var(--modal-bg);
            max-width: 500px;
            width: 90%;
            border-radius: 2rem;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            animation: fadeInUp 0.2s ease;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-menu-opcoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .modal-menu-opcoes button {
            background: var(--modal-btn-bg);
            border: 1px solid var(--modal-btn-border);
            padding: 12px 16px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            color: var(--text-color);
        }
        .modal-menu-opcoes button:hover {
            background: var(--modal-btn-hover);
            transform: scale(0.98);
        }
        .btn-fechar-modal {
            background: var(--modal-btn-bg);
            border: 1px solid var(--modal-btn-border);
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            color: var(--text-color);
        }

        .form-add {
            background: var(--form-bg);
            padding: 1.2rem;
            border-radius: 1.2rem;
            margin: 1.5rem 0 1.8rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            border: 1px solid var(--form-border);
        }
        .campo-add {
            flex: 1;
            min-width: 120px;
        }
        .campo-add label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .campo-add input {
            width: 100%;
            padding: 12px 12px;
            border: 1px solid var(--input-border);
            border-radius: 60px;
            font-size: 0.9rem;
            background: var(--input-bg);
            color: var(--text-color);
        }
        .campo-add input::placeholder {
            color: var(--text-secondary);
        }
        .btn-add {
            background: var(--btn-add);
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 22px;
        }
        .btn-add:hover { background: var(--btn-add-hover); }
        .tabela-lista {
            width: 100%;
            border-radius: 1.2rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .lista-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1.2fr 1.2fr 1.8fr;
            background: var(--header-bg);
            padding: 14px 12px;
            border-radius: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }
        .item-row {
            display: grid;
            grid-template-columns: 3fr 1fr 1.2fr 1.2fr 1.8fr;
            align-items: center;
            background: var(--item-bg);
            padding: 12px 12px;
            margin: 6px 0;
            border-radius: 1rem;
            box-shadow: 0 1px 3px var(--item-shadow);
            border: 1px solid var(--item-border);
            transition: all 0.2s ease;
            cursor: grab;
            color: var(--text-color);
            position: relative;
        }
        .item-row:active {
            cursor: grabbing;
        }
        .item-row.dragging {
            opacity: 0.3;
            cursor: grabbing;
        }
        .item-row.drag-over {
            border-top: 3px solid var(--input-focus);
            margin-top: -3px;
        }
        /* Efeito visual para arrastar para editar */
        .item-row.editing-swipe {
            background: var(--input-focus);
            color: white;
            transition: background 0.1s ease;
            cursor: ew-resize;
        }
        .produto-nome { font-weight: 600; word-break: break-word; }
        .comprado .produto-nome { text-decoration: line-through; color: #22c55e; opacity: 0.7; }
        .comprado {
            background: var(--comprado-bg);
            opacity: 0.85;
            cursor: not-allowed !important;
        }
        .comprado:active {
            cursor: not-allowed !important;
        }
        .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-acao { background: var(--btn-acao); border: none; font-size: 1.1rem; padding: 6px 10px; border-radius: 40px; cursor: pointer; font-weight: bold; transition: 0.1s; color: var(--text-color); }
        .btn-acao:hover { background: var(--btn-acao-hover); transform: scale(0.95); }
        .total-area {
            text-align: right;
            font-size: 1.7rem;
            font-weight: 800;
            margin-top: 1rem;
            padding: 15px 20px;
            background: var(--total-bg);
            border-radius: 1.5rem;
            color: var(--total-color);
        }
        @media (max-width: 700px) {
            .painel { padding: 1.2rem; }
            .lista-header, .item-row { grid-template-columns: 2fr 0.8fr 1fr 1fr 1.5fr; font-size: 0.75rem; gap: 6px; }
        }

        .modal-confirmacao {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        .modal-confirmacao-conteudo {
            background: var(--modal-bg);
            max-width: 400px;
            width: 90%;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .modal-confirmacao-conteudo p {
            margin: 15px 0;
            font-size: 1.1rem;
        }
        .modal-confirmacao-botoes {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn-confirmar {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-cancelar {
            background: var(--modal-btn-bg);
            color: var(--text-color);
            border: 1px solid var(--modal-btn-border);
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        
        /* Modal de edição */
        .modal-edicao {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1002;
        }
        .modal-edicao-conteudo {
            background: var(--modal-bg);
            max-width: 400px;
            width: 90%;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .modal-edicao-conteudo input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--input-border);
            border-radius: 40px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
        }
        .modal-edicao-conteudo input:focus {
            outline: none;
            border-color: var(--input-focus);
        }
        .modal-edicao-botoes {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        /* Scrollbar para modo escuro */
        body.dark ::-webkit-scrollbar {
            width: 10px;
        }
        body.dark ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        body.dark ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="login" class="painel">
        <h2>🛒 Minha Lista</h2>
        <div class="campo">
            <input type="text" id="usuario" placeholder="Seu nome" autocomplete="off">
        </div>
        <div class="campo">
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>
        <button class="btn-principal" onclick="entrar()">🔐 Entrar / Criar conta</button>
    </div>

    <div id="app" style="display: none;">
        <div class="painel">
            <div class="topo-app">
                <h1 class="titulo-app">📋 Lista de Compras</h1>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <span class="usuario-info">👤 <strong id="nomeUsuario"></strong></span>
                    <button class="btn-menu" id="menuBtn" aria-label="Menu">⋮</button>
                </div>
            </div>
            <div class="form-add">
                <div class="campo-add" style="flex:2"><label>🏷️ Produto</label><input type="text" id="produto" placeholder="Ex: Arroz"></div>
                <div class="campo-add"><label>📦 Qtd</label><input type="number" id="quantidade" value="1" min="1"></div>
                <div class="campo-add"><label>💰 Preço (R$)</label><input type="number" id="preco" step="0.01" placeholder="0,00"></div>
                <button class="btn-add" onclick="adicionarItem()">➕ Adicionar</button>
            </div>
            <div class="tabela-lista">
                <div class="lista-header"><span>Produto</span><span>Quant.</span><span>Preço</span><span>Subtotal</span><span>Ações</span></div>
                <div id="listaContainer"></div>
            </div>
            <div class="total-area">🧾 TOTAL: R$ <span id="total">0.00</span></div>
        </div>
    </div>
</div>

<div id="modalMenu" class="modal-menu">
    <div class="modal-menu-conteudo">
        <h3>⚙️ Opções</h3>
        <div class="modal-menu-opcoes">
            <button id="btnModoEscuro" onclick="toggleModoEscuro(); fecharModalMenu();"><span>🌙</span> Modo Escuro</button>
            <button onclick="mudarSenha(); fecharModalMenu();"><span>🔑</span> Alterar Senha</button>
            <button onclick="apagarUsuario(); fecharModalMenu();"><span>🗑️</span> Apagar Meus Dados</button>
            <button onclick="sair(); fecharModalMenu();"><span>🚪</span> Sair</button>
        </div>
        <button class="btn-fechar-modal" onclick="fecharModalMenu()">Fechar</button>
    </div>
</div>

<div id="modalSalvarLogin" class="modal-confirmacao">
    <div class="modal-confirmacao-conteudo">
        <p>🔐 Deseja salvar seu login?</p>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Na próxima vez você não precisará digitar a senha.</p>
        <div class="modal-confirmacao-botoes">
            <button class="btn-confirmar" onclick="confirmarSalvarLogin()">✅ Sim, salvar</button>
            <button class="btn-cancelar" onclick="cancelarSalvarLogin()">❌ Não</button>
        </div>
    </div>
</div>

<!-- Modal de edição -->
<div id="modalEdicao" class="modal-edicao">
    <div class="modal-edicao-conteudo">
        <h3>✏️ Editar Item</h3>
        <input type="text" id="editNome" placeholder="Nome do produto">
        <input type="number" id="editQuantidade" placeholder="Quantidade" min="1">
        <input type="number" id="editPreco" step="0.01" placeholder="Preço">
        <div class="modal-edicao-botoes">
            <button class="btn-confirmar" onclick="salvarEdicao()">💾 Salvar</button>
            <button class="btn-cancelar" onclick="fecharModalEdicao()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    let usuarioAtual = "";
    let totalGeral = 0;
    let currentListItems = [];
    let loginPendente = { usuario: null, senha: null };
    let draggedItemId = null;
    let swipeStartX = null;
    let swipeItemId = null;
    let editandoItemId = null;
    const listaContainer = document.getElementById("listaContainer");
    const totalSpan = document.getElementById("total");

    // Funções do Modo Escuro
    function toggleModoEscuro() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('modo_escuro', isDark ? 'true' : 'false');
        const btnModoEscuro = document.getElementById('btnModoEscuro');
        if (btnModoEscuro) {
            if (isDark) {
                btnModoEscuro.innerHTML = '<span>☀️</span> Modo Claro';
            } else {
                btnModoEscuro.innerHTML = '<span>🌙</span> Modo Escuro';
            }
        }
    }

    function carregarModoEscuro() {
        const isDark = localStorage.getItem('modo_escuro') === 'true';
        if (isDark) {
            document.body.classList.add('dark');
            const btnModoEscuro = document.getElementById('btnModoEscuro');
            if (btnModoEscuro) {
                btnModoEscuro.innerHTML = '<span>☀️</span> Modo Claro';
            }
        }
    }

    function atualizarTotalUI() { 
        totalSpan.innerText = totalGeral.toFixed(2); 
    }
    
    function recalcularTotal() {
        totalGeral = currentListItems.reduce((sum, item) => sum + (item.quantidade * item.preco), 0);
    }
    
    function salvarEstadoCompleto() {
        if (!usuarioAtual) return;
        const itensParaSalvar = currentListItems.map(item => ({ id: item.id, nome: item.nome, quantidade: item.quantidade, preco: item.preco, comprado: item.comprado, dataCriacao: item.dataCriacao }));
        localStorage.setItem(`lista_data_${usuarioAtual}`, JSON.stringify(itensParaSalvar));
        localStorage.setItem(`total_${usuarioAtual}`, totalGeral.toString());
    }
    
    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    function separarLista() {
        const pendentes = currentListItems.filter(item => !item.comprado);
        const adquiridos = currentListItems.filter(item => item.comprado);
        currentListItems = [...pendentes, ...adquiridos];
    }
    
    // Funções para edição por arrasto lateral
    function abrirModalEdicao(itemId) {
        const item = currentListItems.find(i => i.id === itemId);
        if (!item) return;
        if (item.comprado) {
            alert("⚠️ Itens adquiridos não podem ser editados.");
            return;
        }
        editandoItemId = itemId;
        document.getElementById("editNome").value = item.nome;
        document.getElementById("editQuantidade").value = item.quantidade;
        document.getElementById("editPreco").value = item.preco;
        document.getElementById("modalEdicao").style.display = "flex";
    }
    
    function fecharModalEdicao() {
        document.getElementById("modalEdicao").style.display = "none";
        editandoItemId = null;
    }
    
    function salvarEdicao() {
        if (!editandoItemId) return;
        const novoNome = document.getElementById("editNome").value.trim();
        const novaQuantidade = parseInt(document.getElementById("editQuantidade").value);
        const novoPreco = parseFloat(document.getElementById("editPreco").value);
        
        if (!novoNome) {
            alert("Digite o nome do produto.");
            return;
        }
        if (isNaN(novaQuantidade) || novaQuantidade < 1) {
            alert("Quantidade inválida.");
            return;
        }
        if (isNaN(novoPreco) || novoPreco < 0) {
            alert("Preço inválido.");
            return;
        }
        
        const item = currentListItems.find(i => i.id === editandoItemId);
        if (item && !item.comprado) {
            // Remover o valor antigo do total
            totalGeral -= (item.quantidade * item.preco);
            // Atualizar item
            item.nome = novoNome;
            item.quantidade = novaQuantidade;
            item.preco = novoPreco;
            // Adicionar novo valor ao total
            totalGeral += (novaQuantidade * novoPreco);
            salvarEstadoCompleto();
            separarLista();
            renderizarLista();
        }
        fecharModalEdicao();
    }
    
    function handleSwipeStart(e, itemId, isComprado) {
        if (isComprado) return;
        swipeStartX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
        swipeItemId = itemId;
    }
    
    function handleSwipeMove(e, rowElement, isComprado) {
        if (isComprado || !swipeStartX || !swipeItemId) return;
        const currentX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
        const diffX = currentX - swipeStartX;
        
        // Se arrastou mais de 50px para qualquer lado, abrir edição
        if (Math.abs(diffX) > 50) {
            rowElement.classList.add('editing-swipe');
            setTimeout(() => {
                rowElement.classList.remove('editing-swipe');
            }, 200);
            abrirModalEdicao(swipeItemId);
            swipeStartX = null;
            swipeItemId = null;
        }
    }
    
    function handleSwipeEnd() {
        swipeStartX = null;
        swipeItemId = null;
    }
    
    // Drag and drop para reorganizar
    function handleDragStart(e, id, isComprado) {
        if (isComprado) {
            e.preventDefault();
            return false;
        }
        draggedItemId = id;
        e.target.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
        return true;
    }
    
    function handleDragEnd(e) {
        e.target.classList.remove('dragging');
        draggedItemId = null;
        document.querySelectorAll('.item-row').forEach(row => {
            row.classList.remove('drag-over');
        });
    }
    
    function handleDragOver(e, targetId, isCompradoTarget) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        
        if (isCompradoTarget) {
            return;
        }
        
        const targetRow = e.target.closest('.item-row');
        if (targetRow) {
            document.querySelectorAll('.item-row').forEach(row => {
                row.classList.remove('drag-over');
            });
            targetRow.classList.add('drag-over');
        }
    }
    
    function handleDrop(e, targetId, isCompradoTarget) {
        e.preventDefault();
        
        document.querySelectorAll('.item-row').forEach(row => {
            row.classList.remove('drag-over');
        });
        
        if (!draggedItemId) return;
        
        if (isCompradoTarget) {
            alert("⚠️ Não é possível mover itens para a área de adquiridos.");
            return;
        }
        
        const draggedIndex = currentListItems.findIndex(item => item.id === draggedItemId);
        const targetIndex = currentListItems.findIndex(item => item.id === targetId);
        
        if (draggedIndex === -1 || targetIndex === -1) return;
        
        if (currentListItems[draggedIndex].comprado) {
            alert("⚠️ Itens adquiridos não podem ser movidos.");
            return;
        }
        
        if (currentListItems[targetIndex].comprado) {
            alert("⚠️ Não é possível mover itens para depois dos itens adquiridos.");
            return;
        }
        
        const [movedItem] = currentListItems.splice(draggedIndex, 1);
        const newTargetIndex = draggedIndex < targetIndex ? targetIndex - 1 : targetIndex;
        currentListItems.splice(newTargetIndex, 0, movedItem);
        
        separarLista();
        salvarEstadoCompleto();
        renderizarLista();
        
        draggedItemId = null;
    }
    
    function renderizarLista() {
        if (!listaContainer) return;
        
        separarLista();
        
        listaContainer.innerHTML = "";
        if (currentListItems.length === 0) {
            listaContainer.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-secondary);">✨ Nenhum item adicionado. Adicione produtos acima ✨</div>';
            atualizarTotalUI();
            return;
        }
        
        const primeiroCompradoIndex = currentListItems.findIndex(item => item.comprado);
        const temComprados = primeiroCompradoIndex !== -1;
        
        for (let i = 0; i < currentListItems.length; i++) {
            const item = currentListItems[i];
            const subtotal = item.quantidade * item.preco;
            const rowDiv = document.createElement("div");
            rowDiv.className = "item-row";
            if (item.comprado) {
                rowDiv.classList.add("comprado");
                rowDiv.draggable = false;
            } else {
                rowDiv.draggable = true;
            }
            
            rowDiv.setAttribute('data-id', item.id);
            
            // Eventos de drag and drop
            rowDiv.addEventListener('dragstart', (e) => handleDragStart(e, item.id, item.comprado));
            rowDiv.addEventListener('dragend', handleDragEnd);
            rowDiv.addEventListener('dragover', (e) => handleDragOver(e, item.id, item.comprado));
            rowDiv.addEventListener('drop', (e) => handleDrop(e, item.id, item.comprado));
            
            // Eventos de arrasto lateral para editar (mouse)
            rowDiv.addEventListener('mousedown', (e) => handleSwipeStart(e, item.id, item.comprado));
            rowDiv.addEventListener('mousemove', (e) => handleSwipeMove(e, rowDiv, item.comprado));
            rowDiv.addEventListener('mouseup', () => handleSwipeEnd());
            
            // Eventos de toque para mobile
            rowDiv.addEventListener('touchstart', (e) => handleSwipeStart(e, item.id, item.comprado));
            rowDiv.addEventListener('touchmove', (e) => handleSwipeMove(e, rowDiv, item.comprado));
            rowDiv.addEventListener('touchend', () => handleSwipeEnd());
            
            if (item.comprado && i === primeiroCompradoIndex && temComprados && primeiroCompradoIndex > 0) {
                const separador = document.createElement("div");
                separador.style.cssText = "grid-column: 1/-1; text-align: center; padding: 8px; margin: 8px 0 4px 0; background: var(--separador-bg); border-radius: 20px; font-size: 0.8rem; color: var(--separador-color); font-weight: 600;";
                separador.innerText = "✓ ITENS JÁ ADQUIRIDOS ✓";
                listaContainer.appendChild(separador);
            }
            
            rowDiv.innerHTML = `
                <div class="produto-nome">${escapeHtml(item.nome)}</div>
                <span>${item.quantidade}</span>
                <span>R$ ${item.preco.toFixed(2)}</span>
                <span>R$ ${subtotal.toFixed(2)}</span>
                <div class="acoes">
                    <button class="btn-acao btn-check" onclick="toggleComprado('${item.id}')">${item.comprado ? '↩️' : '✔️'}</button>
                    <button class="btn-acao btn-del" onclick="removerItemComConfirmacao('${item.id}')">🗑️</button>
                </div>
            `;
            listaContainer.appendChild(rowDiv);
        }
        atualizarTotalUI();
    }
    
    function adicionarItem() {
        const produto = document.getElementById("produto").value.trim();
        let quantidade = parseInt(document.getElementById("quantidade").value);
        let preco = parseFloat(document.getElementById("preco").value);
        if (!produto) { alert("Digite o nome do produto."); return; }
        if (isNaN(quantidade) || quantidade < 1) quantidade = 1;
        if (isNaN(preco) || preco < 0) preco = 0;
        const novoId = Date.now() + "-" + Math.random().toString(36).substr(2, 6);
        currentListItems.push({ id: novoId, nome: produto, quantidade, preco, comprado: false, dataCriacao: Date.now() });
        recalcularTotal();
        salvarEstadoCompleto(); 
        separarLista();
        renderizarLista();
        document.getElementById("produto").value = "";
        document.getElementById("quantidade").value = "1";
        document.getElementById("preco").value = "";
    }
    
    window.toggleComprado = function(id) {
        let item = currentListItems.find(i => i.id === id);
        if(item) { 
            item.comprado = !item.comprado; 
            recalcularTotal();
            salvarEstadoCompleto(); 
            separarLista();
            renderizarLista();
        }
    };
    
    window.removerItemComConfirmacao = function(id) {
        let item = currentListItems.find(i => i.id === id);
        if(item && confirm(`Remover "${item.nome}" permanentemente?`)) {
            totalGeral -= (item.quantidade * item.preco);
            currentListItems = currentListItems.filter(i => i.id !== id);
            salvarEstadoCompleto(); 
            separarLista();
            renderizarLista();
        }
    };
    
    function carregarDadosUsuario() {
        if(!usuarioAtual) return;
        let stored = localStorage.getItem(`lista_data_${usuarioAtual}`);
        
        if(stored) {
            try {
                currentListItems = JSON.parse(stored).map(it => ({ ...it, preco: parseFloat(it.preco)||0, quantidade: parseInt(it.quantidade)||1, dataCriacao: it.dataCriacao || Date.now() }));
                recalcularTotal();
                separarLista();
                renderizarLista();
            } catch(e) { currentListItems=[]; totalGeral=0; renderizarLista(); }
        } else {
            currentListItems=[]; totalGeral=0; renderizarLista();
        }
    }
    
    function salvarLoginLembrado(usuario, senha) {
        localStorage.setItem("login_lembrado_usuario", usuario);
        localStorage.setItem("login_lembrado_senha", senha);
    }
    
    function limparLoginLembrado() {
        localStorage.removeItem("login_lembrado_usuario");
        localStorage.removeItem("login_lembrado_senha");
    }
    
    function carregarLoginLembrado() {
        const usuario = localStorage.getItem("login_lembrado_usuario");
        const senha = localStorage.getItem("login_lembrado_senha");
        if (usuario && senha) {
            document.getElementById("usuario").value = usuario;
            document.getElementById("senha").value = senha;
            setTimeout(() => {
                entrar();
            }, 100);
        }
    }
    
    function confirmarSalvarLogin() {
        if (loginPendente.usuario && loginPendente.senha) {
            salvarLoginLembrado(loginPendente.usuario, loginPendente.senha);
        }
        loginPendente = { usuario: null, senha: null };
        document.getElementById("modalSalvarLogin").style.display = "none";
    }
    
    function cancelarSalvarLogin() {
        limparLoginLembrado();
        loginPendente = { usuario: null, senha: null };
        document.getElementById("modalSalvarLogin").style.display = "none";
    }
    
    function mostrarDialogoSalvarLogin(usuario, senha) {
        loginPendente = { usuario, senha };
        document.getElementById("modalSalvarLogin").style.display = "flex";
    }
    
    function entrar() {
        const usuario = document.getElementById("usuario").value.trim();
        const senha = document.getElementById("senha").value;
        if(!usuario || !senha) { alert("Preencha usuário e senha"); return; }
        
        const senhaSalva = localStorage.getItem("senha_" + usuario);
        
        if(!senhaSalva) {
            localStorage.setItem("senha_" + usuario, senha);
            alert("✅ Conta criada com sucesso! Bem-vindo(a).");
            mostrarDialogoSalvarLogin(usuario, senha);
        } else {
            if(senha !== senhaSalva) { alert("Senha incorreta"); return; }
            
            const loginSalvoUsuario = localStorage.getItem("login_lembrado_usuario");
            const loginSalvoSenha = localStorage.getItem("login_lembrado_senha");
            
            if (!loginSalvoUsuario || loginSalvoUsuario !== usuario || loginSalvoSenha !== senha) {
                mostrarDialogoSalvarLogin(usuario, senha);
            }
        }
        
        usuarioAtual = usuario;
        localStorage.setItem("usuarioAtual", usuarioAtual);
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
        document.getElementById("nomeUsuario").innerText = usuarioAtual;
        carregarDadosUsuario();
        document.getElementById("senha").value = "";
    }
    
    window.sair = function() {
        if(confirm("Sair da sua conta?")) {
            localStorage.removeItem("usuarioAtual");
            document.getElementById("app").style.display = "none";
            document.getElementById("login").style.display = "block";
            usuarioAtual = "";
            currentListItems = [];
            renderizarLista();
            document.getElementById("usuario").value = "";
            document.getElementById("senha").value = "";
            fecharModalMenu();
        }
    };
    
    window.mudarSenha = function() {
        if(!usuarioAtual) return;
        const antiga = prompt("Digite a senha atual:");
        const senhaSalva = localStorage.getItem("senha_" + usuarioAtual);
        if(antiga !== senhaSalva) { alert("Senha atual incorreta"); return; }
        const nova = prompt("Digite a nova senha:");
        if(nova && nova.trim()) {
            localStorage.setItem("senha_" + usuarioAtual, nova);
            alert("Senha alterada com sucesso!");
            const loginSalvoUsuario = localStorage.getItem("login_lembrado_usuario");
            if (loginSalvoUsuario === usuarioAtual) {
                salvarLoginLembrado(usuarioAtual, nova);
            }
        } else alert("Senha inválida");
    };
    
    window.apagarUsuario = function() {
        if(usuarioAtual && confirm(`ATENÇÃO: Isso apagará TODOS os dados do usuário "${usuarioAtual}". Tem certeza?`)) {
            localStorage.removeItem(`lista_data_${usuarioAtual}`);
            localStorage.removeItem(`total_${usuarioAtual}`);
            localStorage.removeItem(`senha_${usuarioAtual}`);
            localStorage.removeItem("usuarioAtual");
            const loginSalvoUsuario = localStorage.getItem("login_lembrado_usuario");
            if (loginSalvoUsuario === usuarioAtual) {
                limparLoginLembrado();
            }
            alert("Usuário e dados removidos permanentemente.");
            location.reload();
        }
    };
    
    function abrirModalMenu() { 
        document.getElementById("modalMenu").style.display = "flex"; 
    }
    function fecharModalMenu() { 
        document.getElementById("modalMenu").style.display = "none"; 
    }
    
    window.onclick = function(event) {
        if (event.target === document.getElementById("modalMenu")) fecharModalMenu();
        if (event.target === document.getElementById("modalSalvarLogin")) {
            document.getElementById("modalSalvarLogin").style.display = "none";
        }
        if (event.target === document.getElementById("modalEdicao")) {
            fecharModalEdicao();
        }
    };
    
    document.getElementById("menuBtn")?.addEventListener("click", abrirModalMenu);
    
    window.onload = () => {
        carregarModoEscuro();
        carregarLoginLembrado();
        const menuBtn = document.getElementById("menuBtn");
        if (menuBtn) menuBtn.onclick = abrirModalMenu;
    };
</script>
</body>
